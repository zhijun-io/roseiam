spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: roseiam
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roseiam}
    username: ${SPRING_DATASOURCE_USERNAME:roseiam}
    password: ${SPRING_DATASOURCE_PASSWORD:roseiam-local}
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
  docker:
    compose:
      lifecycle-management: start-only
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        readiness:
          include: readinessState,db
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  smtp:
    encryption-key: ${APP_SMTP_ENCRYPTION_KEY:}
  security:
    idle-session-timeout: 15m
    absolute-session-timeout: 8h
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
spring.jackson.deserialization.fail-on-unknown-properties: true
